project_id = "chillwithhomies"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["mobile://**", "exp://127.0.0.1:8081/**"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.test_otp]
84901234567 = "123456"
84987654321 = "123456"

# Local-only placeholder. Test OTP numbers are intercepted before this provider is called.
# Cloud projects must use real credentials configured in the Supabase dashboard.
[auth.sms.messagebird]
enabled = true
originator = "ChillHomies"
access_key = "local-test-only"

[functions.api]
verify_jwt = false
