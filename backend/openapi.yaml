openapi: 3.1.0
info:
  title: ChillWithHomies API
  version: 0.1.0
  description: Contracts for the Supabase Edge Function API. Money values are integer VND demo-ledger amounts.
servers:
  - url: http://127.0.0.1:54321/functions/v1/api
    description: Local Supabase
  - url: https://{projectRef}.supabase.co/functions/v1/api
    description: Supabase Cloud
    variables:
      projectRef:
        default: project-ref
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Phone OTP, signup completion, and legacy-state migration.
  - name: Profile and social
    description: Profile, friend request, friendship, and blocking operations.
  - name: Sessions
    description: Meetup discovery, participation, check-in, and demo bill ledger.
  - name: Chat
    description: Meetup room history, messages, read state, and polls.
  - name: Safety
    description: Grab and SOS signals scoped to meetup participants.
  - name: Notifications
    description: In-app notification state and Expo push token registration.
paths:
  /auth/otp/request:
    post:
      operationId: requestPhoneOtp
      summary: Request a phone OTP
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: OTP accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/verify:
    post:
      operationId: verifyPhoneOtp
      summary: Verify a phone OTP and create a session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/signup/complete:
    post:
      operationId: completeSignup
      summary: Complete the five-step signup profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignUpInput'
      responses:
        '201':
          description: Created profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /migration/import:
    post:
      operationId: importLegacyDemoState
      summary: Import the local demo-state-v3 payload once
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationImportRequest'
      responses:
        '200':
          description: Mapping from legacy IDs to server IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated profile
      tags: [Profile and social]
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMe
      summary: Update editable profile fields
      tags: [Profile and social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /profiles/username-availability:
    get:
      operationId: checkUsernameAvailability
      summary: Check whether a normalized username is available
      tags: [Profile and social]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_.]{3,20}$'
      responses:
        '200':
          description: Username availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getProfile
      summary: Get a visible user profile
      tags: [Profile and social]
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social/friend-requests:
    get:
      operationId: listFriendRequests
      summary: List sent and received friend requests
      tags: [Profile and social]
      responses:
        '200':
          description: Friend request state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: sendFriendRequest
      summary: Send a friend request
      tags: [Profile and social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionInput'
      responses:
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /social/friend-requests/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: cancelFriendRequest
      summary: Cancel a sent friend request
      tags: [Profile and social]
      responses:
        '204':
          description: Request cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social/friend-requests/{userId}/accept:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: acceptFriendRequest
      summary: Accept a received friend request
      tags: [Profile and social]
      responses:
        '200':
          description: Friendship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social/friend-requests/{userId}/reject:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: rejectFriendRequest
      summary: Reject a received friend request
      tags: [Profile and social]
      responses:
        '204':
          description: Request rejected
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social/friends/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: unfriendUser
      summary: Remove a friendship
      tags: [Profile and social]
      responses:
        '204':
          description: Friendship removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social/blocks:
    post:
      operationId: blockUser
      summary: Block a user
      tags: [Profile and social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionInput'
      responses:
        '201':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /social/blocks/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: unblockUser
      summary: Unblock a user
      tags: [Profile and social]
      responses:
        '204':
          description: User unblocked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups:
    get:
      operationId: listMeetups
      summary: Search and filter visible meetups
      tags: [Sessions]
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/MeetupSort'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated meetups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMeetup
      summary: Create a meetup
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetupDraft'
      responses:
        '201':
          description: Created meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /meetups/{meetupId}:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    get:
      operationId: getMeetup
      summary: Get meetup details
      tags: [Sessions]
      responses:
        '200':
          description: Meetup details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups/{meetupId}/join:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: joinMeetup
      summary: Join a meetup
      tags: [Sessions]
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /meetups/{meetupId}/leave:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: leaveMeetup
      summary: Leave a meetup
      tags: [Sessions]
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups/{meetupId}/emergency-leave:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: emergencyLeaveMeetup
      summary: Leave a meetup through the safety flow
      tags: [Sessions]
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups/{meetupId}/check-in:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: checkInMeetup
      summary: Check in to a meetup
      tags: [Sessions]
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups/{meetupId}/table:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    patch:
      operationId: updateMeetupTable
      summary: Update the table-booked state
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tableBooked]
              properties:
                tableBooked: { type: boolean }
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /meetups/{meetupId}/bill/total:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: setMeetupBillTotal
      summary: Set and split the meetup bill
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [total]
              properties:
                total: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /meetups/{meetupId}/bill/my-payment:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: markMyMeetupPayment
      summary: Mark the caller's demo bill payment as submitted
      tags: [Sessions]
      responses:
        '200':
          description: Payment submission recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meetups/{meetupId}/bill/confirm:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: confirmMeetupPayment
      summary: Confirm a participant's demo bill payment
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionInput'
      responses:
        '200':
          description: Updated meetup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chat/rooms/{meetupId}:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: ensureChatRoom
      summary: Ensure the meetup chat room exists
      tags: [Chat]
      responses:
        '200':
          description: Chat room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chat/rooms/{meetupId}/messages:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    get:
      operationId: listChatMessages
      summary: Get paginated chat history
      tags: [Chat]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: sendChatMessage
      summary: Send a chat message
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageInput'
      responses:
        '201':
          description: Authoritative message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chat/rooms/{meetupId}/read:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: markChatRoomRead
      summary: Mark a chat room as read
      tags: [Chat]
      responses:
        '204':
          description: Room marked read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chat/polls/{messageId}/vote:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      operationId: voteChatPoll
      summary: Idempotently select one poll option
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        '200':
          description: Updated poll message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /meetups/{meetupId}/safety-signals:
    parameters:
      - $ref: '#/components/parameters/MeetupId'
    post:
      operationId: sendSafetySignal
      summary: Send a Grab or SOS safety signal
      tags: [Safety]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetySignalInput'
      responses:
        '202':
          description: Signal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySignal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the authenticated user
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read
      tags: [Notifications]
      responses:
        '204':
          description: Notification marked read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every notification as read
      tags: [Notifications]
      responses:
        '204':
          description: Notifications marked read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/push-tokens:
    post:
      operationId: registerPushToken
      summary: Register an Expo push token
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenInput'
      responses:
        '201':
          description: Token registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    MeetupId:
      name: meetupId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Operation is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found or hidden by access policy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Resource already exists or state conflicts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the request may be retried
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ActionResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error: { type: string }
        code: { type: string }
    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, minLength: 9, maxLength: 16 }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, token]
      properties:
        phone: { type: string, minLength: 9, maxLength: 16 }
        token: { type: string, pattern: '^\d{6}$' }
    AuthSession:
      type: object
      additionalProperties: false
